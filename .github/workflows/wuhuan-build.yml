name: 无患影音 Android 构建

on:
  push:
    branches:
      - wuhuan/development
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wuhuan-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mobile:
    name: Build Android mobile APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          yes | sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/wuhuan-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "mode=release-signed" >> "$GITHUB_OUTPUT"
            echo "WUHUAN_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "正式签名密钥已加载。"
          else
            echo "mode=debug-signed-test-only" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置完整正式签名 Secrets；本次 APK 使用 debug 签名，仅供临时测试，不能作为正式升级包。"
          fi

      - name: Build mobile arm64 release variant
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleMobileArm64_v8aRelease --no-daemon --console=plain

      - name: Build Android TV arm64 test APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleLeanbackArm64_v8aRelease --no-daemon --console=plain

      - name: Upload Android TV test APK
        uses: actions/upload-artifact@v4
        with:
          name: wuhuan-android-tv-arm64-debug-signed-test-only-${{ github.run_number }}
          path: app/build/outputs/apk/leanbackArm64_v8a/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Android TV armeabi-v7a test APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleLeanbackArmeabi_v7aRelease --no-daemon --console=plain

      - name: Upload Android TV armeabi-v7a test APK
        uses: actions/upload-artifact@v4
        with:
          name: wuhuan-android-tv-armeabi-v7a-debug-signed-test-only-${{ github.run_number }}
          path: app/build/outputs/apk/leanbackArmeabi_v7a/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wuhuan-android-mobile-arm64-${{ steps.signing.outputs.mode }}-${{ github.run_number }}
          path: app/build/outputs/apk/mobileArm64_v8a/release/*.apk
          if-no-files-found: error
          retention-days: 14
